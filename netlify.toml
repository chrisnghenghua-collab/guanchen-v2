# GUANCHEN V2 - Netlify configuration (P5, 2026-10-23).
# Only the two v2 endpoints are deployed. The old interface lives in engine/legacy/ and is used by tests only.
[build]
  base = "engine"
  publish = "public"
  command = "echo GUANCHEN: no build step"

[build.environment]
  NODE_VERSION = "24"

[functions]
  directory = "netlify/functions"
  # Default bundler on purpose (2026-10-23): node_bundler = "nft" made Netlify treat these as old-style
  # functions ("handler is not a function"). The engine is no longer merged into the function file because
  # the function loads it at run time from a computed path (see netlify/functions/*.mjs).
  # The engine imports .ts files directly (Node 24 strips types) and reads its data/copy files from disk,
  # so these folders and the four pinned libraries are shipped as-is next to the functions.
  included_files = ["api/**", "interpretation/**", "packages/**", "server/**", "src/**",
    "node_modules/astronomy-engine/**", "node_modules/tyme4ts/**", "node_modules/moment-timezone/**", "node_modules/moment/**"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
