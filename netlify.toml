# GUANCHEN V2 - Netlify configuration (P5, 2026-10-23).
# Only the two v2 endpoints are deployed. The old interface lives in engine/legacy/ and is used by tests only.
[build]
  base = "engine"
  publish = "public"
  command = "echo GUANCHEN: no build step"

[build.environment]
  NODE_VERSION = "24"

[functions]
  directory = "netlify/functions"
  # Default bundler. The function loads the engine at run time from a computed path (see netlify/functions/*.mjs),
  # so the engine is not merged into the function file and its import.meta.url file reads keep working.
  # The engine reads its data/copy files from disk, so these folders and the four pinned libraries are shipped
  # as-is next to the functions. package.json must ship too ("type": "module").
  # No .ts files may be shipped: Netlify's packager converts them itself and overwrote the function entry
  # (all 2026-10-23 deploy failures). The engine's .ts files were converted to .mjs with Node's own type stripping.
  included_files = ["package.json", "api/**", "interpretation/**", "packages/**", "server/**", "src/**",
    "node_modules/astronomy-engine/**", "node_modules/tyme4ts/**", "node_modules/moment-timezone/**", "node_modules/moment/**"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
