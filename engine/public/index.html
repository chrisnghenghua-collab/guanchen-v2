<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>观辰</title>
<style>
  :root { --bg:#f6f4ef; --fg:#2b2a27; --muted:#7a766d; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1c1b19; --fg:#ece9e2; --muted:#9a958b; } }
  html,body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--fg); display:grid; place-items:center; padding:0 16px;
         font-family:"Noto Serif SC","Songti SC","SimSun",serif; text-align:center; }
  h1 { font-weight:500; letter-spacing:.3em; margin:0 0 .6em; font-size:2rem; }
  p { color:var(--muted); margin:0; font-size:.95rem; line-height:1.8; }
</style>
</head>
<body>
  <main>
    <h1>观辰</h1>
    <p>网站建设中</p>
  </main>
</body>
</html>
